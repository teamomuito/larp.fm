name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No SIGNING_KEYSTORE_BASE64 secret; the APK is signed with a throwaway debug key."
          fi

      - name: Test and build
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "larpfm-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: larpfm-apk
          path: larpfm-*.apk
          if-no-files-found: error

  release:
    # Every push to the default branch becomes a release, so the newest APK is always at
    # https://github.com/teamomuito/larp.fm/releases/latest/download/larpfm.apk
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history, to list the commits since the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: larpfm-apk

      - name: Publish release
        run: |
          mv larpfm-*.apk larpfm.apk
          previous=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..$GITHUB_SHA"; else range="-1 $GITHUB_SHA"; fi
          git log --no-merges --format='- %s' $range > notes.md
          gh release create "build-$GITHUB_RUN_NUMBER" larpfm.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "larp.fm build $GITHUB_RUN_NUMBER" \
            --notes-file notes.md \
            --latest

      - name: Keep the 5 newest releases
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[5:][].tagName' |
            while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            done
